<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopwise – Vergelijk je boodschappen</title>
  <meta name="description" content="Maak je boodschappenlijst en vergelijk voorbeeldprijzen van Nederlandse winkels met Shopwise.">
  <meta name="theme-color" content="#16a34a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.lidl.nl">
  <link rel="preconnect" href="https://www.ah.nl">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">Ga naar de inhoud</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Shopwise, naar de startpagina">
        <span class="brand-mark" aria-hidden="true">🛒</span>
        <span class="brand-name">Shopwise</span>
      </a>
      <form class="header-search" id="zoekformulier" role="search" autocomplete="off">
        <label class="sr-only" for="zoekveld">Zoek producten</label>
        <input id="zoekveld" type="search" placeholder="Zoek producten, bijvoorbeeld melk" enterkeyhint="search">
      </form>
      <nav class="header-nav" aria-label="Hoofdmenu">
        <a href="#/" data-nav="/">Winkels</a>
        <a id="nav-account" href="#/inloggen" data-nav="account">Inloggen</a>
        <a class="basket-link" href="#/winkelmand" data-nav="/winkelmand" aria-label="Mijn boodschappenlijst">
          <span aria-hidden="true">🧺</span><span class="basket-text">Mijn lijst</span><span id="mandteller" class="badge" aria-live="polite">0</span>
        </a>
      </nav>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="site-footer">
    <div class="footer-inner">
      <p><strong>Shopwise</strong> helpt je boodschappen plannen en winkelprijzen vergelijken.</p>
      <p class="muted">Shopwise verkoopt en bezorgt geen producten en verwerkt geen betalingen. Voorbeeldprijzen zijn niet actueel en dienen alleen om de website te testen.</p>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:1rem;text-align:center">Shopwise heeft JavaScript nodig. Schakel JavaScript in en laad de pagina opnieuw.</p></noscript>
  <script src="js/products.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
